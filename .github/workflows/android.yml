# Builds the prototype app on every push and publishes it as a release tagged build-<n>.
# The installed app checks the latest release and offers a one-tap update.
name: Android prototype build

on:
  push:
    branches: [main, claude/confident-planck-dn7fy2]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public values only. The OpenAI key lives on the Supabase server, never here.
      PARHLOU_AI_URL: https://hulfrloizndafqchcwhz.supabase.co/functions/v1/ai
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_1B5nCScqVoPf4YyzKQ1caQ_-Gi2WaEU
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Test
        working-directory: android
        # Both versions: the direct-download prototype and the Play Store build.
        run: ./gradlew :app:testPrototypeDebugUnitTest :app:testPlayDebugUnitTest :scanner:testDebugUnitTest
      - name: Private release key (when the owner has added it)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: >
          ./gradlew :app:assemblePrototypeRelease :app:bundlePlayRelease
          -PbuildNumber=${{ github.run_number }}
          -PparhlouAiUrl=$PARHLOU_AI_URL
          -PsupabaseAnonKey=$SUPABASE_PUBLISHABLE_KEY
          -PupdateRepo=${{ github.repository }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/prototype/release/app-prototype-release.apk parhlou.apk
          # The Google Play version (no self-updater, no install permission): upload this .aab in Play Console.
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab parhlou-play.aab
          # Release notes = the newest entry of the in-app "What's new" page, so both always say the same.
          python3 -c "
          import json
          n = json.load(open('android/app/src/main/assets/whats-new.json'))[0]
          lines = ['## ' + n['title'], ''] + ['- ' + c for c in n['changes']]
          if n.get('yourRequests'): lines += ['', '### Your requests in this update', ''] + ['- ' + r for r in n['yourRequests']]
          lines += ['', 'Automatic prototype build of ${{ github.sha }}. Not a Play Store release.']
          open('notes.md', 'w').write(chr(10).join(lines))
          "
          gh release create "build-${{ github.run_number }}" parhlou.apk parhlou-play.aab \
            --title "Parhlou prototype build ${{ github.run_number }}" \
            --notes-file notes.md \
            --target "${{ github.sha }}" --latest
