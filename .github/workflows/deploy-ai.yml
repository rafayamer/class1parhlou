# Deploys the AI gateway (supabase/functions/ai) to Supabase whenever it changes, or on "Run workflow".
# Needs the repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal access token), added by the owner.
# Deploys the AI function only, never the database.
name: Deploy AI server
on:
  push:
    paths: ["supabase/functions/ai/**", "scripts/deploy-supabase.sh"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Type-check the gateway
        working-directory: supabase/functions/ai
        run: npx -y -p typescript@5.6.3 tsc -p tsconfig.json
      - name: Test the gateway
        run: node --experimental-strip-types --test supabase/functions/ai/core.test.ts
      - name: Deploy the ai function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set, skipping (see docs/owner-setup.md, step 1)."
            exit 0
          fi
          ./scripts/deploy-supabase.sh hulfrloizndafqchcwhz function
